<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFB Recruiting Origins Map</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson@3"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* ── Controls bar ─────────────────────────────────────── */
    #controls {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 20;
      background: rgba(13, 17, 23, 0.95);
      border-bottom: 1px solid #30363d;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 52px;
    }

    #app-title {
      font-size: 13px;
      font-weight: 600;
      color: #c9d1d9;
      white-space: nowrap;
      letter-spacing: 0.01em;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
    }

    #school-search {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
      color: #e6edf3;
      font-size: 13px;
      outline: none;
    }

    #school-search:focus { border-color: #388bfd; }

    #school-search::placeholder { color: #8b949e; }

    #school-list {
      position: fixed;
      z-index: 30;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow-y: auto;
      max-height: 260px;
      min-width: 220px;
      display: none;
      box-shadow: 0 8px 24px rgba(1, 4, 9, 0.5);
    }

    .school-option {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid #21262d;
    }

    .school-option:last-child { border-bottom: none; }

    .school-option:hover { background: #21262d; }

    .school-conf {
      font-size: 11px;
      color: #8b949e;
      margin-left: 6px;
    }

    #year-select {
      padding: 6px 10px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
      color: #e6edf3;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    #year-select:focus { border-color: #388bfd; }

    /* ── Map ──────────────────────────────────────────────── */
    #map-container {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 36px;
    }

    svg#map {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    svg#map:active { cursor: grabbing; }

    .state {
      fill: #161b22;
      stroke: #30363d;
      stroke-width: 0.5;
    }

    .school-group { cursor: pointer; }

    .school-dot {
      fill: #484f58;
      stroke: #8b949e;
      stroke-width: 0.8;
      transition: fill 0.15s;
    }

    .school-group:hover .school-dot { fill: #8b949e; }

    .school-dot.selected { fill: #f0f6fc; stroke: #f0f6fc; }

    .school-hit { pointer-events: all; }

    .recruit-arc {
      fill: none;
      stroke-width: 1.2;
      opacity: 0.55;
      pointer-events: stroke;
      cursor: pointer;
    }

    .recruit-arc:hover { opacity: 1; stroke-width: 2; }

    .recruit-dot { opacity: 0.65; cursor: pointer; }

    .recruit-dot:hover { opacity: 1; }

    /* ── Tooltip ──────────────────────────────────────────── */
    #tooltip {
      position: fixed;
      pointer-events: none;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.6;
      display: none;
      z-index: 40;
      max-width: 220px;
    }

    #tooltip strong { color: #f0f6fc; font-size: 13px; }

    .stars-gold { color: #d29922; }
    .stars-blue { color: #388bfd; }
    .stars-green { color: #3fb950; }
    .stars-gray { color: #8b949e; }

    /* ── Info bar ─────────────────────────────────────────── */
    #info-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 36px;
      background: rgba(13, 17, 23, 0.95);
      border-top: 1px solid #30363d;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #8b949e;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    #recruit-count { margin-left: auto; }
    #recruit-count.tappable { cursor: pointer; color: #388bfd; }
    #recruit-count.tappable:hover { color: #58a6ff; }

    #hint { font-style: italic; }

    /* ── Players panel ────────────────────────────────────── */
    #players-panel {
      position: fixed;
      left: 0; right: 0; bottom: 36px;
      max-height: 65vh;
      background: #161b22;
      border-top: 1px solid #30363d;
      border-radius: 12px 12px 0 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      box-shadow: 0 -4px 24px rgba(1, 4, 9, 0.6);
    }
    #players-panel.open { transform: translateY(0); }

    #players-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
      gap: 8px;
    }

    #players-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #f0f6fc;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #players-close {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 18px;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
    }
    #players-close:hover { color: #f0f6fc; }

    #players-list {
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .player-row {
      display: flex;
      align-items: center;
      padding: 9px 16px;
      border-bottom: 1px solid #21262d;
      gap: 10px;
      font-size: 13px;
    }
    .player-row:last-child { border-bottom: none; }

    .player-star-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .player-name-pos {
      flex: 1.5;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .player-name {
      color: #e6edf3;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .player-pos { color: #8b949e; font-size: 11px; flex-shrink: 0; }

    .player-hometown {
      flex: 1;
      color: #8b949e;
      font-size: 12px;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-year { color: #8b949e; font-size: 12px; flex-shrink: 0; }

    /* ── Feedback button ──────────────────────────────────── */
    #feedback-btn {
      position: fixed;
      bottom: 44px;
      right: 14px;
      z-index: 45;
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 20px;
      color: #8b949e;
      font-size: 12px;
      font-family: inherit;
      padding: 5px 10px 5px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    #feedback-btn:hover { background: #30363d; color: #e6edf3; }

    /* ── Feedback form panel ──────────────────────────────── */
    #feedback-panel {
      position: fixed;
      left: 0; right: 0; bottom: 36px;
      max-height: 70vh;
      background: #161b22;
      border-top: 1px solid #30363d;
      border-radius: 12px 12px 0 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      box-shadow: 0 -4px 24px rgba(1, 4, 9, 0.6);
    }
    #feedback-panel.open { transform: translateY(0); }

    #feedback-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
      gap: 8px;
    }
    #feedback-header span {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: #f0f6fc;
    }
    #feedback-close {
      background: none; border: none;
      color: #8b949e; font-size: 18px;
      cursor: pointer; padding: 0 2px; line-height: 1;
    }
    #feedback-close:hover { color: #f0f6fc; }

    #feedback-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      -webkit-overflow-scrolling: touch;
    }

    .fb-type-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .fb-type-btn {
      flex: 1;
      padding: 6px 4px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #8b949e;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .fb-type-btn.active {
      border-color: #388bfd;
      background: rgba(56, 139, 253, 0.1);
      color: #58a6ff;
    }

    #feedback-desc {
      width: 100%;
      min-height: 90px;
      padding: 8px 10px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      margin-bottom: 10px;
    }
    #feedback-desc:focus { border-color: #388bfd; }
    #feedback-desc::placeholder { color: #8b949e; }

    #feedback-email {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #0d1117;
      color: #e6edf3;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
    }
    #feedback-email:focus { border-color: #388bfd; }
    #feedback-email::placeholder { color: #8b949e; }

    #feedback-submit {
      width: 100%;
      padding: 8px;
      background: #238636;
      border: 1px solid #2ea043;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #feedback-submit:hover:not(:disabled) { background: #2ea043; }
    #feedback-submit:disabled { opacity: 0.5; cursor: default; }

    #feedback-status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }
    #feedback-status.ok  { color: #3fb950; }
    #feedback-status.err { color: #ff7b72; }

    /* ── Mobile ───────────────────────────────────────────── */
    @media (max-width: 600px) {
      #app-title { display: none; }
      .search-wrap { max-width: none; flex: 1; }
      .legend-item span { display: none; }
      #hint { display: none; }
    }
  </style>
</head>
<body>

<div id="controls">
  <span id="app-title">CFB Recruiting Origins</span>
  <div class="search-wrap">
    <input type="text" id="school-search" placeholder="Search for a school…" autocomplete="off" spellcheck="false">
  </div>
  <div id="school-list"></div>
  <select id="year-select">
    <option value="all">All Years</option>
  </select>
</div>

<div id="map-container">
  <svg id="map"></svg>
</div>

<div id="tooltip"></div>

<button id="feedback-btn" aria-label="Leave feedback">
  <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
    <path d="M1 2.75C1 1.784 1.784 1 2.75 1h10.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 13.25 12H9.06l-2.573 2.573A1.458 1.458 0 0 1 4 13.543V12H2.75A1.75 1.75 0 0 1 1 10.25Z"/>
  </svg>
  Feedback
</button>

<div id="feedback-panel">
  <div id="feedback-header">
    <span>Share feedback</span>
    <button id="feedback-close" aria-label="Close">✕</button>
  </div>
  <div id="feedback-body">
    <div class="fb-type-row">
      <button class="fb-type-btn active" data-type="Suggestion">💡 Suggestion</button>
      <button class="fb-type-btn" data-type="Bug">🐛 Bug</button>
      <button class="fb-type-btn" data-type="Data">📊 Data issue</button>
    </div>
    <textarea id="feedback-desc" placeholder="Describe what you'd like to see changed or fixed…" maxlength="1000"></textarea>
    <input type="email" id="feedback-email" placeholder="Email (optional, if you'd like a reply)">
    <button id="feedback-submit">Submit feedback</button>
    <div id="feedback-status"></div>
  </div>
</div>

<div id="players-panel">
  <div id="players-header">
    <span id="players-title"></span>
    <button id="players-close" aria-label="Close">✕</button>
  </div>
  <div id="players-list"></div>
</div>

<div id="info-bar">
  <div class="legend-item"><div class="legend-dot" style="background:#d29922"></div><span>5★</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#388bfd"></div><span>4★</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div><span>3★</span></div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b949e"></div><span>2★</span></div>
  <span id="hint">Click a school dot or search to explore</span>
  <span id="recruit-count"></span>
</div>

<script>
"use strict";

const STAR_COLOR = {
  5: "#d29922",
  4: "#388bfd",
  3: "#3fb950",
  2: "#8b949e",
  1: "#8b949e",
  0: "#8b949e",
};

const STAR_CLASS = {
  5: "stars-gold",
  4: "stars-blue",
  3: "stars-green",
  2: "stars-gray",
  1: "stars-gray",
  0: "stars-gray",
};

// ── State ─────────────────────────────────────────────────
let selectedSchool = null;
let selectedYear = "all";
let allRecruits = [];
let schoolMap = {};
let schoolsList = [];
let jitteredPositions = {};
let stateFeatures = null;
let projection, pathGen;

// ── DOM refs ──────────────────────────────────────────────
const svg = d3.select("#map");
const mapContainer = document.getElementById("map-container");
const tooltip = document.getElementById("tooltip");
const recruitCount = document.getElementById("recruit-count");
const hint = document.getElementById("hint");
const schoolSearch = document.getElementById("school-search");
const schoolListEl = document.getElementById("school-list");
const yearSelect = document.getElementById("year-select");
const playersPanel = document.getElementById("players-panel");
const playersTitle = document.getElementById("players-title");
const playersList = document.getElementById("players-list");
document.getElementById("players-close").addEventListener("click", closePlayersPanel);

// ── SVG layer structure ───────────────────────────────────
const zoomLayer = svg.append("g").attr("class", "zoom-layer");
const baseLayer = zoomLayer.append("g").attr("class", "base-layer");
const schoolLayer = zoomLayer.append("g").attr("class", "school-layer");
let arcLayer = zoomLayer.append("g").attr("class", "arc-layer");

// ── Zoom ──────────────────────────────────────────────────
let currentZoom = 1;
const zoom = d3.zoom()
  .scaleExtent([1, 10])
  .on("zoom", ({ transform }) => {
    zoomLayer.attr("transform", transform);
    // Scale hit circles inversely so they stay a constant screen size.
    // Visible dots grow naturally with zoom — that's fine and helpful.
    const k = transform.k;
    if (k !== currentZoom) {
      currentZoom = k;
      const r = hitRadius() / k;
      schoolLayer.selectAll("circle.school-hit").attr("r", r);
    }
  });
svg.call(zoom);

// Double-tap/click to reset zoom
svg.on("dblclick.zoom", null);
svg.on("dblclick", () => {
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
});

// ── Players panel ─────────────────────────────────────────
function openPlayersPanel() {
  renderPlayersPanel();
  playersPanel.classList.add("open");
}

function closePlayersPanel() {
  playersPanel.classList.remove("open");
}

function renderPlayersPanel() {
  if (!selectedSchool) return;
  let recruits = allRecruits.filter(r => r.school_id === selectedSchool.id);
  if (selectedYear !== "all") recruits = recruits.filter(r => r.year === +selectedYear);
  recruits.sort((a, b) => (b.stars || 0) - (a.stars || 0) || b.year - a.year);

  const yearLabel = selectedYear === "all" ? "All Years" : `${selectedYear} Class`;
  playersTitle.textContent = `${selectedSchool.name} · ${recruits.length} recruit${recruits.length !== 1 ? "s" : ""} (${yearLabel})`;

  playersList.innerHTML = recruits.map(r => {
    const color = STAR_COLOR[r.stars] || STAR_COLOR[0];
    return `<div class="player-row">
      <div class="player-star-dot" style="background:${color}"></div>
      <div class="player-name-pos">
        <span class="player-name">${r.name}</span>
        <span class="player-pos">${r.position}</span>
      </div>
      <div class="player-hometown">${r.hometown_city}, ${r.hometown_state}</div>
      <span class="player-year">${r.year}</span>
    </div>`;
  }).join("");
}

// ── Dynamic sizing ────────────────────────────────────────
function dotRadius() {
  return Math.max(2.5, Math.min(5, getSize()[0] / 180));
}
function hitRadius() {
  return Math.max(dotRadius() * 2.5, 14);
}
function recruitDotRadius() {
  return Math.max(1.5, Math.min(3.5, getSize()[0] / 250));
}

// Push overlapping school dots apart so dense clusters are distinguishable.
// Runs offline (no animation) and stores adjusted pixel positions.
function computeJitteredPositions(schools) {
  const minDist = dotRadius() * 2 + 1.5;
  const nodes = schools.map(s => {
    const pt = projection([s.lng, s.lat]) ?? [-9999, -9999];
    return { id: s.id, x: pt[0], y: pt[1] };
  });
  for (let iter = 0; iter < 60; iter++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const dx = nodes[j].x - nodes[i].x;
        const dy = nodes[j].y - nodes[i].y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
        if (dist < minDist) {
          const push = (minDist - dist) / 2;
          const nx = dx / dist, ny = dy / dist;
          nodes[i].x -= nx * push;
          nodes[i].y -= ny * push;
          nodes[j].x += nx * push;
          nodes[j].y += ny * push;
        }
      }
    }
  }
  jitteredPositions = {};
  nodes.forEach(n => { jitteredPositions[n.id] = [n.x, n.y]; });
}

// ── Projection ────────────────────────────────────────────
function buildProjection(w, h, features) {
  return d3.geoAlbersUsa().fitSize([w, h], features);
}

function getSize() {
  return [mapContainer.clientWidth, mapContainer.clientHeight];
}

// ── Arcs ──────────────────────────────────────────────────
function arcPath(sx, sy, tx, ty) {
  const dx = tx - sx, dy = ty - sy;
  const len = Math.sqrt(dx * dx + dy * dy) || 1;
  const curveOffset = len * 0.22;
  const cx = (sx + tx) / 2 - (dy / len) * curveOffset;
  const cy = (sy + ty) / 2 + (dx / len) * curveOffset;
  return `M${sx},${sy} Q${cx},${cy} ${tx},${ty}`;
}

// ── Tooltip ───────────────────────────────────────────────
function showTooltip(event, recruit) {
  const stars = recruit.stars || 0;
  const starStr = "★".repeat(stars) + "☆".repeat(Math.max(0, 5 - stars));
  tooltip.innerHTML =
    `<strong>${recruit.name}</strong><br>` +
    `<span class="${STAR_CLASS[stars]}">${starStr}</span> ${recruit.position}<br>` +
    `${recruit.hometown_city}, ${recruit.hometown_state} (${recruit.year})`;
  tooltip.style.display = "block";
  void tooltip.offsetWidth; // force layout so offsetWidth/Height are current
  moveTooltip(event);
}

function moveTooltip(event) {
  const x = event.clientX ?? event.touches?.[0]?.clientX ?? 0;
  const y = event.clientY ?? event.touches?.[0]?.clientY ?? 0;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  tooltip.style.left = Math.max(6, Math.min(x + 14, window.innerWidth - tw - 6)) + "px";
  tooltip.style.top = Math.max(58, Math.min(y + 14, window.innerHeight - th - 6)) + "px";
}

function hideTooltip() {
  tooltip.style.display = "none";
}

// ── Draw arcs for selected school ─────────────────────────
function drawArcs(school, year) {
  arcLayer.remove();
  arcLayer = zoomLayer.insert("g", ".school-layer").attr("class", "arc-layer");

  if (!school) {
    recruitCount.textContent = "";
    recruitCount.classList.remove("tappable");
    closePlayersPanel();
    hint.style.display = "";
    return;
  }

  hint.style.display = "none";

  let recruits = allRecruits.filter(r => r.school_id === school.id);
  if (year !== "all") recruits = recruits.filter(r => r.year === +year);

  const schoolPt = jitteredPositions[school.id] ?? projection([school.lng, school.lat]);
  if (!schoolPt) {
    recruitCount.textContent = "School location unavailable";
    return;
  }

  recruitCount.textContent = `${recruits.length} recruit${recruits.length !== 1 ? "s" : ""} ▸`;
  recruitCount.classList.add("tappable");
  if (playersPanel.classList.contains("open")) renderPlayersPanel();

  const arcGroup = arcLayer.append("g");
  const dotGroup = arcLayer.append("g");

  recruits.forEach((r, i) => {
    const homePt = projection([r.lng, r.lat]);
    if (!homePt) return;

    const color = STAR_COLOR[r.stars] || STAR_COLOR[0];

    // Arc
    const arcEl = arcGroup.append("path")
      .attr("class", "recruit-arc")
      .attr("d", arcPath(homePt[0], homePt[1], schoolPt[0], schoolPt[1]))
      .attr("stroke", color)
      .on("mousemove", (ev) => { showTooltip(ev, r); moveTooltip(ev); })
      .on("touchmove", (ev) => { showTooltip(ev, r); moveTooltip(ev); ev.preventDefault(); })
      .on("mouseleave touchend", hideTooltip);

    const totalLength = arcEl.node().getTotalLength();
    arcEl
      .style("stroke-dasharray", `${totalLength} ${totalLength}`)
      .style("stroke-dashoffset", totalLength)
      .transition()
      .duration(400)
      .delay(Math.min(i * 5, 600))
      .ease(d3.easeQuadOut)
      .style("stroke-dashoffset", 0);

    // Hometown dot
    dotGroup.append("circle")
      .attr("class", "recruit-dot")
      .attr("cx", homePt[0])
      .attr("cy", homePt[1])
      .attr("r", recruitDotRadius())
      .attr("fill", color)
      .on("mousemove", (ev) => { showTooltip(ev, r); moveTooltip(ev); })
      .on("touchmove", (ev) => { showTooltip(ev, r); moveTooltip(ev); ev.preventDefault(); })
      .on("mouseleave touchend", hideTooltip);
  });
}

// ── Select school ─────────────────────────────────────────
function selectSchool(school) {
  selectedSchool = school;
  closePlayersPanel();
  schoolLayer.selectAll("g.school-group")
    .select("circle.school-dot")
    .classed("selected", d => d.id === school.id);
  drawArcs(school, selectedYear);
}

// ── School search ─────────────────────────────────────────
function renderSchoolList(schools, query) {
  const matches = schools
    .filter(s =>
      s.name.toLowerCase().includes(query) ||
      s.abbreviation.toLowerCase().includes(query)
    )
    .slice(0, 12);

  if (!matches.length) { schoolListEl.style.display = "none"; return; }

  const rect = schoolSearch.getBoundingClientRect();
  schoolListEl.style.top = (rect.bottom + 4) + "px";
  schoolListEl.style.left = rect.left + "px";
  schoolListEl.style.width = Math.max(rect.width, 240) + "px";
  schoolListEl.style.display = "block";
  schoolListEl.innerHTML = matches
    .map(s => `<div class="school-option" data-id="${s.id}">${s.name}<span class="school-conf">${s.conference}</span></div>`)
    .join("");

  schoolListEl.querySelectorAll(".school-option").forEach(el => {
    el.addEventListener("click", () => {
      const school = schoolMap[el.dataset.id];
      if (school) {
        schoolSearch.value = school.name;
        schoolListEl.style.display = "none";
        selectSchool(school);
      }
    });
  });
}

// ── Resize ────────────────────────────────────────────────
function handleResize() {
  if (!stateFeatures) return;
  const [w, h] = getSize();
  svg.call(zoom.transform, d3.zoomIdentity);
  projection = buildProjection(w, h, stateFeatures);
  pathGen = d3.geoPath().projection(projection);

  computeJitteredPositions(schoolsList);

  baseLayer.selectAll("path.state").attr("d", pathGen);

  schoolLayer.selectAll("g.school-group")
    .attr("transform", d => {
      const pt = jitteredPositions[d.id] ?? [-999, -999];
      return `translate(${pt[0]},${pt[1]})`;
    });
  schoolLayer.selectAll("g.school-group circle.school-dot").attr("r", dotRadius());
  schoolLayer.selectAll("g.school-group circle.school-hit").attr("r", hitRadius());

  if (selectedSchool) drawArcs(selectedSchool, selectedYear);
}

// ── Feedback form ─────────────────────────────────────────
const FEEDBACK_WORKER = "https://cfb-feedback-worker.palmerjones0.workers.dev";

(function initFeedback() {
  const panel    = document.getElementById("feedback-panel");
  const btn      = document.getElementById("feedback-btn");
  const closeBtn = document.getElementById("feedback-close");
  const desc     = document.getElementById("feedback-desc");
  const emailEl  = document.getElementById("feedback-email");
  const submit   = document.getElementById("feedback-submit");
  const status   = document.getElementById("feedback-status");
  const typeBtns = document.querySelectorAll(".fb-type-btn");
  let selectedType = "Suggestion";

  typeBtns.forEach(b => b.addEventListener("click", () => {
    typeBtns.forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    selectedType = b.dataset.type;
  }));

  function openFeedback() { panel.classList.add("open"); desc.focus(); }
  function closeFeedback() {
    panel.classList.remove("open");
    status.textContent = "";
    status.className = "feedback-status";
  }

  btn.addEventListener("click", openFeedback);
  closeBtn.addEventListener("click", closeFeedback);
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") closeFeedback();
  });
  panel.addEventListener("click", (ev) => { ev.stopPropagation(); });

  submit.addEventListener("click", async () => {
    const text = desc.value.trim();
    if (text.length < 5) {
      status.textContent = "Please add a bit more detail.";
      status.className = "err";
      return;
    }
    submit.disabled = true;
    status.textContent = "Submitting…";
    status.className = "";

    try {
      const resp = await fetch(FEEDBACK_WORKER, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          type: selectedType,
          description: text,
          email: emailEl.value.trim() || null,
          school: selectedSchool?.name || null,
          year: selectedYear !== "all" ? selectedYear : null,
          ua: navigator.userAgent,
          viewport: `${window.innerWidth}×${window.innerHeight}`,
        }),
      });

      if (resp.ok) {
        const { number } = await resp.json();
        status.textContent = `Thanks! Logged as #${number}.`;
        status.className = "ok";
        desc.value = "";
        emailEl.value = "";
        setTimeout(closeFeedback, 2200);
      } else {
        status.textContent = "Something went wrong — try again.";
        status.className = "err";
        submit.disabled = false;
      }
    } catch {
      status.textContent = "Network error — try again.";
      status.className = "err";
      submit.disabled = false;
    }
  });
})();

// ── Bootstrap ─────────────────────────────────────────────
const CDN = "https://cdn.jsdelivr.net/gh/palmerjones0/cfb-recruiting-viz@main/public";
Promise.all([
  d3.json(`${CDN}/schools.json`),
  d3.json(`${CDN}/recruits.json`),
  d3.json(`${CDN}/us-states.topojson`),
]).then(([schools, recruits, us]) => {
  allRecruits = recruits;
  schoolsList = schools;
  schools.forEach(s => { schoolMap[s.id] = s; });

  stateFeatures = topojson.feature(us, us.objects.states);

  const [w, h] = getSize();
  projection = buildProjection(w, h, stateFeatures);
  pathGen = d3.geoPath().projection(projection);

  computeJitteredPositions(schools);

  // States
  baseLayer.selectAll("path.state")
    .data(stateFeatures.features)
    .join("path")
    .attr("class", "state")
    .attr("d", pathGen);

  // School dots — each school is a <g> with a visible dot + larger invisible hit target
  const schoolGroups = schoolLayer.selectAll("g.school-group")
    .data(schools)
    .join("g")
    .attr("class", "school-group")
    .attr("transform", d => {
      const pt = jitteredPositions[d.id] ?? [-999, -999];
      return `translate(${pt[0]},${pt[1]})`;
    })
    .on("click", (ev, d) => {
      schoolSearch.value = d.name;
      schoolListEl.style.display = "none";
      selectSchool(d);
    });

  schoolGroups.append("circle")
    .attr("class", "school-dot")
    .attr("r", dotRadius());

  schoolGroups.append("circle")
    .attr("class", "school-hit")
    .attr("r", hitRadius())
    .attr("fill", "transparent");

  schoolGroups.append("title").text(d => d.name);

  // Year select
  const years = [...new Set(recruits.map(r => r.year))].sort((a, b) => b - a);
  years.forEach(y => {
    const opt = document.createElement("option");
    opt.value = y;
    opt.textContent = `${y} Class`;
    yearSelect.appendChild(opt);
  });

  yearSelect.addEventListener("change", () => {
    selectedYear = yearSelect.value;
    if (selectedSchool) drawArcs(selectedSchool, selectedYear);
  });

  recruitCount.addEventListener("click", () => {
    if (selectedSchool) openPlayersPanel();
  });

  // Search input
  schoolSearch.addEventListener("input", () => {
    const q = schoolSearch.value.toLowerCase().trim();
    if (!q) { schoolListEl.style.display = "none"; return; }
    renderSchoolList(schools, q);
  });

  schoolSearch.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") schoolListEl.style.display = "none";
  });

  document.addEventListener("click", (ev) => {
    if (!schoolSearch.contains(ev.target) && !schoolListEl.contains(ev.target)) {
      schoolListEl.style.display = "none";
    }
    if (playersPanel.classList.contains("open") &&
        !playersPanel.contains(ev.target) &&
        ev.target !== recruitCount) {
      closePlayersPanel();
    }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { schoolListEl.style.display = "none"; closePlayersPanel(); }
  });

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(handleResize, 150);
  });
}).catch(err => {
  console.error("Failed to load map data:", err);
  document.getElementById("map-container").innerHTML =
    `<p style="color:#ff7b72;padding:20px;font-size:14px">Failed to load map data. Data may still be loading — try refreshing in a moment.</p>`;
});
</script>
